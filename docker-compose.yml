version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: dogfood_db
    environment:
      POSTGRES_USER: dogfood
      POSTGRES_PASSWORD: dogfood_password
      POSTGRES_DB: dogfood_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # We will mount a seed script later for Fixture Data Seeding
      # - ./backend/seed.sql:/docker-entrypoint-initdb.d/seed.sql
    restart: unless-stopped

  backend:
    build: 
      context: ./backend
    container_name: dogfood_backend
    command: bash -c "python seed.py && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql+psycopg2://dogfood:dogfood_password@db:5432/dogfood_db
      - JWT_SECRET_KEY=super_secret_offline_key_for_hackathon
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: dogfood_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:8000

volumes:
  pgdata:
